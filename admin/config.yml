local_backend: true

backend:
  name: git-gateway

media_folder: "photo"
public_folder: "/photo"

collections:
  - name: "products"
    label: "Ürünler"
    folder: "content"
    create: true
    slug: "{{fields.title}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Görsel", name: "image", widget: "image" }
      - label: "Özellikler"
        name: "features"
        widget: "list"
        field: { label: "Özellik", name: "feature", widget: "string" }