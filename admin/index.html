<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin Panel - NOOR NETWORK</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
body { background:#0a0a0a; color:#e5e7eb; min-height:100vh; padding:20px; }
.login-box { max-width:400px; margin:100px auto; background:#111827; padding:40px; border-radius:16px; border:1px solid #1f2937; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.login-box h1 { font-size:24px; margin-bottom:30px; text-align:center; color:#fff; }
.login-box input { width:100%; padding:14px 18px; background:#1f2937; border:1px solid #374151; border-radius:10px; color:#fff; font-size:15px; margin-bottom:16px; }
.login-box input:focus { outline:none; border-color:#3b82f6; }
.login-box button { width:100%; padding:14px; background:#3b82f6; border:none; border-radius:10px; color:#fff; font-size:15px; font-weight:700; cursor:pointer; transition:all .2s; }
.login-box button:hover { background:#2563eb; }
.error { color:#ef4444; font-size:14px; text-align:center; margin-top:10px; display:none; }
#panel { display:none; max-width:1100px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid #1f2937; }
.header h1 { font-size:22px; color:#fff; }
.logout-btn { padding:10px 20px; background:#374151; border:none; border-radius:8px; color:#fff; cursor:pointer; font-size:14px; }
.logout-btn:hover { background:#ef4444; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
.card { background:#111827; border:1px solid #1f2937; border-radius:16px; padding:28px; }
.card h2 { font-size:18px; color:#fff; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid #1f2937; }
label { display:block; font-size:13px; color:#9ca3af; margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
input, select, textarea { width:100%; padding:12px 16px; background:#1f2937; border:1px solid #374151; border-radius:10px; color:#fff; font-size:14px; font-family:inherit; margin-bottom:18px; }
input:focus, select:focus, textarea:focus { outline:none; border-color:#3b82f6; }
textarea { min-height:120px; resize:vertical; font-family:'Courier New',monospace; font-size:13px; }
.btn-primary { width:100%; padding:14px; background:#3b82f6; border:none; border-radius:10px; color:#fff; font-size:15px; font-weight:700; cursor:pointer; transition:all .2s; }
.btn-primary:hover { background:#2563eb; }
.btn-copy { width:100%; padding:12px; background:#10b981; border:none; border-radius:10px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; margin-top:12px; }
.btn-copy:hover { background:#059669; }
.output-box { background:#0a0a0a; border:1px solid #1f2937; border-radius:10px; padding:20px; min-height:300px; font-family:'Courier New',monospace; font-size:12px; color:#6ee7b7; white-space:pre-wrap; word-break:break-all; overflow-x:auto; }
.output-box:empty::before { content:"Generated code will appear here..."; color:#4b5563; }
.helper { background:#1e3a8a; border-left:4px solid #3b82f6; padding:14px 18px; border-radius:8px; font-size:13px; color:#dbeafe; line-height:1.6; margin-bottom:20px; }
.helper strong { color:#fff; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h1>🔒 Admin Access</h1>
    <input type="password" id="pwInput" placeholder="Enter password..." autocomplete="off">
    <button onclick="checkPassword()">Login</button>
    <div class="error" id="errorMsg">Wrong password. Try again.</div>
</div>

<div id="panel">
    <div class="header">
        <h1>🛠️ NOOR NETWORK — Admin Panel</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="helper">
        <strong>How to use:</strong> Fill in the fields → click <strong>Generate Code</strong> → copy the HTML → go to GitHub → open <code>index.html</code> → click the pencil icon → paste the code between the correct marker comments → commit.
    </div>

    <div class="grid">
        <div class="card">
            <h2>Product Details</h2>

            <label>Category</label>
            <select id="category">
                <option value="laptop_new">New Laptop</option>
                <option value="second_hand_dell">Second Hand — Dell</option>
                <option value="second_hand_lenovo">Second Hand — Lenovo</option>
                <option value="second_hand_hp">Second Hand — HP</option>
                <option value="second_hand_surface">Second Hand — Surface</option>
                <option value="second_hand_macbook">Second Hand — Macbook</option>
                <option value="cooler">Cooler Pad</option>
                <option value="case">Computer Case</option>
                <option value="fiber">Fiber Optic</option>
            </select>

            <label>Product Title (line 1)</label>
            <input type="text" id="title1" placeholder="e.g. Lenovo ThinkPad">

            <label>Product Title (line 2 — optional, shown in blue)</label>
            <input type="text" id="title2" placeholder="e.g. T480s">

            <label>Image Path</label>
            <input type="text" id="imgPath" placeholder="e.g. ./photo/lenovo/Lenovo-T480s.webp">

            <label>Features (one per line)</label>
            <textarea id="features" placeholder="Intel Core i7 - 8th Gen&#10;RAM 16GB&#10;HARD 512GB SSD&#10;14 inch Screen"></textarea>

            <button class="btn-primary" onclick="generateCode()">⚡ Generate Code</button>
        </div>

        <div class="card">
            <h2>Generated HTML</h2>
            <div class="output-box" id="output"></div>
            <button class="btn-copy" onclick="copyCode()" id="copyBtn" style="display:none;">📋 Copy to Clipboard</button>
        </div>
    </div>
</div>

<script>
const ADMIN_PASSWORD = "noor2002";

function checkPassword() {
    const input = document.getElementById('pwInput').value;
    if (input === ADMIN_PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        sessionStorage.setItem('noor_admin_ok', '1');
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}

function logout() {
    sessionStorage.removeItem('noor_admin_ok');
    location.reload();
}

if (sessionStorage.getItem('noor_admin_ok') === '1') {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
}

document.getElementById('pwInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkPassword();
});

function generateCode() {
    const cat = document.getElementById('category').value;
    const title1 = document.getElementById('title1').value.trim();
    const title2 = document.getElementById('title2').value.trim();
    const img = document.getElementById('imgPath').value.trim();
    const featRaw = document.getElementById('features').value.trim();

    if (!title1 || !img) {
        alert('Please fill in at least the Product Title (line 1) and Image Path.');
        return;
    }

    const features = featRaw.split('\n').map(f => f.trim()).filter(f => f).map(f => `<li>${f}</li>`).join('');
    const titleHTML = title2 ? `<span>${title1}</span>${title2}` : `<span>${title1}</span>`;

    const waSVG = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>`;

    const card = `<div class="sub-product-card" onclick="this.classList.toggle('flipped')"><div class="sub-product-card-inner"><div class="sub-product-card-front"><div class="sub-product-card-img-wrapper"><img src="${img}" alt="${title1}" class="sub-product-card-img" loading="lazy" decoding="async"></div><h3 class="sub-product-card-title">${titleHTML}</h3></div><div class="sub-product-card-back"><h4 data-i18n="features">Features</h4><ul>${features}</ul><a href="https://wa.me/9647504533130" target="_blank" onclick="event.stopPropagation()" class="w-full py-2.5 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2">${waSVG}WhatsApp</a></div></div></div>`;

    const markers = {
        laptop_new: '<!-- ===== NEW LAPTOP START ===== -->',
        second_hand_dell: '<!-- ===== DELL START ===== -->',
        second_hand_lenovo: '<!-- ===== LENOVO START ===== -->',
        second_hand_hp: '<!-- ===== HP START ===== -->',
        second_hand_surface: '<!-- ===== SURFACE START ===== -->',
        second_hand_macbook: '<!-- ===== MACBOOK START ===== -->',
        cooler: '<!-- ===== COOLER START ===== -->',
        case: '<!-- ===== CASE START ===== -->',
        fiber: '<!-- ===== FIBER START ===== -->'
    };

    const instruction = `========================================
📋 HOW TO ADD THIS PRODUCT:
========================================

1. Copy the HTML code below.
2. Go to GitHub and open: index.html
3. Click the pencil icon (✏️ Edit).
4. Press Ctrl+F and search for this exact line:

   ${markers[cat]}

5. Paste the code RIGHT AFTER that line.
6. Scroll down, click "Commit changes".
7. Wait 1-2 minutes. Done! ✅

========================================
CODE TO COPY:
========================================

${card}`;

    document.getElementById('output').textContent = instruction;
    document.getElementById('copyBtn').style.display = 'block';
}

function copyCode() {
    const output = document.getElementById('output').textContent;
    const cardOnly = output.split('CODE TO COPY:\n========================================\n\n')[1] || output;
    navigator.clipboard.writeText(cardOnly).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy to Clipboard'; }, 2000);
    });
}
</script>
</body>
</html>
